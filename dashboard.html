<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commandes — Mademoiselle Bobùn</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%94%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --noir: #0B0805;
      --noir2: #151009;
      --ivoire: #F4EDE0;
      --caramel: #E8912D;
      --vert: #2ECC71;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Be Vietnam Pro', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--noir);
      color: var(--ivoire);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 30px clamp(14px, 3vw, 44px) 60px;
    }
    :focus-visible { outline: 2px solid var(--caramel); outline-offset: 3px; border-radius: 4px; }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 26px;
    }
    h1 { font-weight: 900; font-size: clamp(1.4rem, 3vw, 2rem); }
    h1 .dot {
      display: inline-block; width: 11px; height: 11px; border-radius: 50%;
      background: #666; margin-left: 10px; vertical-align: middle;
    }
    h1 .dot.live { background: var(--vert); box-shadow: 0 0 10px var(--vert); }
    .meta { font-family: var(--mono); font-size: .68rem; letter-spacing: .13em; color: rgba(244,237,224,.5); }

    .stats { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
    .stat {
      background: var(--noir2); border: 1px solid rgba(244,237,224,.1);
      border-radius: 14px; padding: 14px 22px; min-width: 150px;
    }
    .stat b { display: block; font-size: 1.5rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    .stat span { font-family: var(--mono); font-size: .58rem; letter-spacing: .14em; color: rgba(244,237,224,.5); }

    .tablewrap { overflow-x: auto; border: 1px solid rgba(244,237,224,.1); border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; min-width: 780px; }
    th {
      font-family: var(--mono); font-size: .6rem; letter-spacing: .14em; text-align: left;
      color: var(--caramel); padding: 14px 16px; border-bottom: 1px solid rgba(244,237,224,.12);
      background: var(--noir2); position: sticky; top: 0;
    }
    td { padding: 13px 16px; border-bottom: 1px solid rgba(244,237,224,.06); font-size: .92rem; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr.fresh td { animation: freshrow 2.4s ease-out; }
    @keyframes freshrow { 0%, 40% { background: rgba(46, 204, 113, .18); } 100% { background: transparent; } }
    .code { font-family: var(--mono); font-weight: 500; color: var(--caramel); white-space: nowrap; }
    .items { font-weight: 300; line-height: 1.55; }
    .note { font-weight: 300; font-style: italic; color: rgba(244,237,224,.72); max-width: 260px; }
    .amount { font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tel { font-family: var(--mono); font-size: .78rem; white-space: nowrap; }
    .when { font-family: var(--mono); font-size: .72rem; color: rgba(244,237,224,.6); white-space: nowrap; }
    .badge {
      display: inline-block; font-family: var(--mono); font-size: .58rem; letter-spacing: .1em;
      padding: 4px 10px; border-radius: 999px; background: rgba(46,204,113,.15);
      color: var(--vert); border: 1px solid rgba(46,204,113,.4); white-space: nowrap;
    }
    .empty { padding: 60px 20px; text-align: center; color: rgba(244,237,224,.45); font-weight: 300; }

    /* ---- imprimante bluetooth ---- */
    .print-ctl { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .bt-btn {
      font-family: var(--mono); font-size: .6rem; letter-spacing: .12em;
      background: transparent; color: rgba(244,237,224,.75);
      border: 1px solid rgba(244,237,224,.3); border-radius: 999px;
      padding: 9px 16px; cursor: pointer; transition: border-color .25s, color .25s;
      white-space: nowrap;
    }
    .bt-btn:hover { border-color: var(--caramel); color: var(--caramel); }
    .bt-btn.on { color: var(--vert); border-color: rgba(46,204,113,.6); }
    .bt-btn.on::before { content: '● '; }
    .autop {
      font-family: var(--mono); font-size: .58rem; letter-spacing: .12em;
      color: rgba(244,237,224,.55); display: inline-flex; align-items: center; gap: 7px;
      cursor: pointer; user-select: none;
    }
    .autop input { accent-color: var(--caramel); }
    .print-btn {
      background: transparent; border: 1px solid rgba(244,237,224,.22);
      border-radius: 9px; font-size: .95rem; padding: 6px 10px; cursor: pointer;
      transition: border-color .25s, transform .15s;
    }
    .print-btn:hover { border-color: var(--caramel); }
    .print-btn:active { transform: scale(.92); }
    .print-btn.done { border-color: rgba(46,204,113,.6); }

    /* ---- Overlay vert clignotant : nouvelle commande payée ---- */
    #flash {
      position: fixed; inset: 0; z-index: 100;
      display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
      background: rgba(46, 204, 113, .32);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      text-align: center;
      cursor: pointer;
    }
    #flash.on { display: flex; animation: flashblink .5s step-end 8; }
    @keyframes flashblink {
      0% { background: rgba(46, 204, 113, .45); }
      50% { background: rgba(46, 204, 113, .12); }
    }
    #flash .big {
      font-weight: 900; font-size: clamp(2rem, 6vw, 4rem);
      text-shadow: 0 4px 30px rgba(0,0,0,.5);
    }
    #flash .code-big { font-family: var(--mono); font-size: clamp(1.4rem, 4vw, 2.4rem); color: #fff; }
    #flash .hint { font-family: var(--mono); font-size: .62rem; letter-spacing: .16em; color: rgba(255,255,255,.85); }

    /* ---- écran de connexion ---- */
    #login {
      position: fixed; inset: 0; z-index: 90; background: var(--noir);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    #login input {
      background: var(--noir2); border: 1px solid rgba(244,237,224,.2); border-radius: 10px;
      color: var(--ivoire); font-family: var(--mono); font-size: 1rem; letter-spacing: .1em;
      padding: 13px 18px; width: min(300px, 80vw); text-align: center;
    }
    #login button {
      background: var(--caramel); color: var(--noir); border: none; border-radius: 999px;
      font-weight: 800; font-size: .95rem; padding: 13px 30px; cursor: pointer; font-family: var(--sans);
    }
    #login .err { color: #ff9d7a; font-size: .85rem; min-height: 1.2em; }
  </style>
</head>
<body>

  <div id="login">
    <p class="meta">MADEMOISELLE BOBÙN · DASHBOARD COMMANDES</p>
    <input id="key" type="password" placeholder="CLÉ D'ACCÈS" autocomplete="current-password">
    <button id="enter">Entrer</button>
    <p class="err" id="login-err"></p>
  </div>

  <header hidden>
    <h1>Commandes <span class="dot" id="live-dot" title="connexion temps réel"></span></h1>
    <div class="print-ctl">
      <button id="bt-connect" class="bt-btn" title="Appairer l'imprimante Bluetooth (Chrome/Android)">🖨 CONNECTER L'IMPRIMANTE</button>
      <label class="autop"><input type="checkbox" id="autoprint" checked> IMPRESSION AUTO</label>
      <p class="meta" id="today-meta">—</p>
    </div>
  </header>

  <div class="stats" hidden>
    <div class="stat"><b id="st-count">0</b><span>COMMANDES AUJOURD'HUI</span></div>
    <div class="stat"><b id="st-total">0 €</b><span>ENCAISSÉ AUJOURD'HUI</span></div>
    <div class="stat"><b id="st-bols">0</b><span>BOLS AUJOURD'HUI</span></div>
  </div>

  <div class="tablewrap" hidden>
    <table>
      <thead>
        <tr><th>HEURE</th><th>CODE</th><th>DÉTAIL</th><th>NOTE</th><th>CLIENT</th><th>MONTANT</th><th>STATUT</th><th title="Imprimer">🖨</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Aucune commande pour l'instant — le wok attend.</div>
  </div>

  <div id="flash" role="alert">
    <div class="big">🍜 NOUVELLE COMMANDE</div>
    <div class="code-big" id="flash-code"></div>
    <div class="hint">TOUCHER POUR FERMER</div>
  </div>

  <script>
    (() => {
      'use strict';
      const $ = s => document.querySelector(s);
      let KEY = localStorage.getItem('bobun_dash_key') || '';
      let known = new Set();

      const eur = c => (c / 100).toFixed(2).replace('.', ',') + ' €';
      const hhmm = iso => new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      const isToday = iso => new Date(iso).toDateString() === new Date().toDateString();

      function rowHtml(o, fresh) {
        const items = o.items.map(i => `${i.qty} × ${i.name}`).join('<br>');
        const d = new Date(o.date);
        const when = isToday(o.date) ? hhmm(o.date) : d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' ' + hhmm(o.date);
        return `<tr class="${fresh ? 'fresh' : ''}" data-id="${o.sessionId}">
          <td class="when">${when}</td>
          <td class="code">${o.code}</td>
          <td class="items">${items}</td>
          <td class="note">${o.note ? o.note.replace(/</g, '&lt;') : '—'}</td>
          <td class="tel">${o.phone || '—'}${o.email ? '<br>' + o.email.replace(/</g, '&lt;') : ''}</td>
          <td class="amount">${eur(o.amount)}</td>
          <td><span class="badge">PAYÉE</span></td>
          <td><button class="print-btn" data-sid="${o.sessionId}" title="Imprimer le ticket" aria-label="Imprimer la commande ${o.code}">🖨</button></td>
        </tr>`;
      }

      function refreshStats(list) {
        const today = list.filter(o => isToday(o.date));
        $('#st-count').textContent = today.length;
        $('#st-total').textContent = eur(today.reduce((s, o) => s + o.amount, 0));
        $('#st-bols').textContent = today.reduce((s, o) => s + o.items.reduce((q, i) => q + i.qty, 0), 0);
        $('#today-meta').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
      }

      let all = [];

      function renderAll(list) {
        all = list;
        $('#rows').innerHTML = list.map(o => rowHtml(o, false)).join('');
        $('#empty').hidden = list.length > 0;
        list.forEach(o => known.add(o.sessionId));
        refreshStats(list);
      }

      function addOrder(o) {
        if (known.has(o.sessionId)) return;
        known.add(o.sessionId);
        all.unshift(o);
        $('#rows').insertAdjacentHTML('afterbegin', rowHtml(o, true));
        $('#empty').hidden = true;
        refreshStats(all);
        // overlay vert clignotant
        $('#flash-code').textContent = o.code + ' · ' + eur(o.amount);
        const fl = $('#flash');
        fl.classList.remove('on');
        void fl.offsetWidth;
        fl.classList.add('on');
        clearTimeout(fl._t);
        fl._t = setTimeout(() => fl.classList.remove('on'), 10000);
        // impression automatique du ticket (si imprimante connectée)
        if ($('#autoprint').checked && btChar && !printed.has(o.sessionId)) {
          printed.add(o.sessionId);
          printOrder(o, document.querySelector(`.print-btn[data-sid="${o.sessionId}"]`));
        }
      }

      $('#flash').addEventListener('click', () => $('#flash').classList.remove('on'));

      /* ============================================================
         IMPRIMANTE BLUETOOTH (ESC/POS via Web Bluetooth — Chrome)
         ============================================================ */

      const btBtn = $('#bt-connect');
      let btChar = null;          // characteristic d'écriture
      let btDevice = null;
      const printed = new Set(); // anti double impression auto

      // services BLE courants des imprimantes thermiques
      const BT_SERVICES = [
        '000018f0-0000-1000-8000-00805f9b34fb',
        'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
        '0000ffe0-0000-1000-8000-00805f9b34fb',
        '0000ff00-0000-1000-8000-00805f9b34fb',
        '49535343-fe7d-4ae5-8fa9-9fafd205e455'
      ];

      function btStatus(on, label) {
        btBtn.classList.toggle('on', on);
        btBtn.textContent = label || (on ? '🖨 IMPRIMANTE CONNECTÉE' : '🖨 CONNECTER L\'IMPRIMANTE');
      }

      async function findWriteChar(server) {
        const services = await server.getPrimaryServices();
        for (const svc of services) {
          let chars = [];
          try { chars = await svc.getCharacteristics(); } catch (e) { continue; }
          for (const ch of chars) {
            if (ch.properties.writeWithoutResponse || ch.properties.write) return ch;
          }
        }
        return null;
      }

      async function btConnect() {
        if (!navigator.bluetooth) {
          alert('Bluetooth non disponible dans ce navigateur.\nUtilisez Chrome sur Android ou sur ordinateur (pas Safari iPhone).');
          return;
        }
        try {
          btStatus(false, '🖨 RECHERCHE…');
          btDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: BT_SERVICES
          });
          btDevice.addEventListener('gattserverdisconnected', () => { btChar = null; btStatus(false); });
          const server = await btDevice.gatt.connect();
          btChar = await findWriteChar(server);
          if (!btChar) throw new Error('caractéristique d\'écriture introuvable');
          btStatus(true);
        } catch (e) {
          btChar = null;
          btStatus(false);
          if (e.name !== 'NotFoundError') alert('Connexion imprimante impossible : ' + e.message);
        }
      }

      btBtn.addEventListener('click', () => {
        if (btChar) { try { btDevice.gatt.disconnect(); } catch (e) {} btChar = null; btStatus(false); }
        else btConnect();
      });

      /* ---- ticket ESC/POS (58mm, 32 colonnes) ---- */

      const ascii = s => String(s || '')
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[œŒ]/g, 'oe').replace(/€/g, 'EUR')
        .replace(/[«»“”]/g, '"').replace(/[’‘]/g, "'")
        .replace(/[^\x20-\x7E\n]/g, '');

      function line2(left, right, w = 32) {
        left = ascii(left); right = ascii(right);
        const space = Math.max(1, w - left.length - right.length);
        return left + ' '.repeat(space) + right + '\n';
      }

      function buildTicket(o) {
        const b = [];
        const push = (...xs) => b.push(...xs);
        const txt = s => { for (const c of ascii(s)) push(c.charCodeAt(0)); };
        const ESC = 0x1B, GS = 0x1D;
        push(ESC, 0x40);                          // init
        push(ESC, 0x61, 1);                       // centré
        push(ESC, 0x45, 1); txt('MADEMOISELLE BOBUN\n'); push(ESC, 0x45, 0);
        txt('GHOST KITCHEN - BORDEAUX\n');
        txt('--------------------------------\n');
        push(GS, 0x21, 0x11);                     // double taille
        txt(o.code + '\n');
        push(GS, 0x21, 0x00);
        const d = new Date(o.date);
        txt(d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + '\n');
        txt('--------------------------------\n');
        push(ESC, 0x61, 0);                       // gauche
        o.items.forEach(i => {
          txt(line2(`${i.qty} x ${i.name}`, eur(i.amount).replace('€', 'E')));
        });
        txt('--------------------------------\n');
        push(ESC, 0x45, 1);
        txt(line2('TOTAL', eur(o.amount).replace('€', 'E')));
        push(ESC, 0x45, 0);
        if (o.note) {
          txt('--------------------------------\n');
          push(ESC, 0x45, 1); txt('NOTE :\n'); push(ESC, 0x45, 0);
          txt(ascii(o.note) + '\n');
        }
        if (o.phone) txt('\nClient : ' + ascii(o.phone) + '\n');
        push(ESC, 0x61, 1);
        txt('\nA EMPORTER - PAYEE EN LIGNE\nMerci !\n');
        push(ESC, 0x64, 4);                       // avance papier
        push(GS, 0x56, 0x42, 0x00);               // coupe partielle (si massicot)
        return new Uint8Array(b);
      }

      async function btWrite(bytes) {
        const CHUNK = 100;
        for (let i = 0; i < bytes.length; i += CHUNK) {
          const part = bytes.slice(i, i + CHUNK);
          if (btChar.properties.writeWithoutResponse) await btChar.writeValueWithoutResponse(part);
          else await btChar.writeValue(part);
          await new Promise(r => setTimeout(r, 25));
        }
      }

      async function printOrder(o, btn) {
        if (!btChar) {
          if (btn) alert('Imprimante non connectée — cliquez sur « Connecter l\'imprimante ».');
          return false;
        }
        try {
          await btWrite(buildTicket(o));
          if (btn) { btn.classList.add('done'); setTimeout(() => btn.classList.remove('done'), 2000); }
          return true;
        } catch (e) {
          console.error('impression :', e);
          if (btn) alert('Échec impression : ' + e.message);
          return false;
        }
      }

      /* icône 🖨 sur chaque ligne */
      $('#rows').addEventListener('click', e => {
        const btn = e.target.closest('.print-btn');
        if (!btn) return;
        const o = all.find(x => x.sessionId === btn.dataset.sid);
        if (o) printOrder(o, btn);
      });

      let es = null;
      function connectStream() {
        if (es) es.close();
        es = new EventSource('/api/orders/stream?key=' + encodeURIComponent(KEY));
        es.onopen = () => $('#live-dot').classList.add('live');
        es.onerror = () => $('#live-dot').classList.remove('live');
        es.addEventListener('order', e => { try { addOrder(JSON.parse(e.data)); } catch (err) { /* ignore */ } });
      }

      async function load() {
        const res = await fetch('/api/orders', { headers: { 'x-dash-key': KEY } });
        if (!res.ok) throw new Error('clé');
        const data = await res.json();
        renderAll(data.orders || []);
      }

      async function start() {
        try {
          await load();
        } catch (e) {
          localStorage.removeItem('bobun_dash_key');
          $('#login').style.display = 'flex';
          $('#login-err').textContent = KEY ? 'Clé refusée.' : '';
          return;
        }
        $('#login').style.display = 'none';
        document.querySelectorAll('[hidden]').forEach(el => { if (el.id !== 'empty' || all.length === 0) el.hidden = false; });
        $('#empty').hidden = all.length > 0;
        connectStream();
        setInterval(() => load().catch(() => {}), 60000); // filet de sécurité
      }

      $('#enter').addEventListener('click', () => {
        KEY = $('#key').value.trim();
        localStorage.setItem('bobun_dash_key', KEY);
        start();
      });
      $('#key').addEventListener('keydown', e => { if (e.key === 'Enter') $('#enter').click(); });

      if (KEY) start(); else $('#login').style.display = 'flex';
    })();
  </script>
</body>
</html>
